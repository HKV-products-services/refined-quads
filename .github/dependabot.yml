---
# Weekly update PRs for the GitHub Actions in .github/workflows and the Python
# dependencies in pyproject.toml / uv.lock. Each ecosystem is grouped into one PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
