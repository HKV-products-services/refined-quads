---
# Weekly update PRs for the GitHub Actions in .github/workflows and the Python
# dependencies in pyproject.toml / uv.lock. Each ecosystem is grouped into one PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Only update uv.lock within the ranges in pyproject.toml: the upper bounds there
    # are deliberate, and a library's lower bounds should stay at the true minimum.
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
