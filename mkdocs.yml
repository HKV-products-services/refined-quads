site_name: refined-quads
site_description: Generate and refine refined quad meshes for D-Flow FM.
repo_name: refined-quads
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Agent instructions live next to the docs but are not part of the site.
exclude_docs: |
  agents/
  snippets/

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true
            show_source: false
            members_order: source

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorial:
      - Your first mesh: tutorial/first-mesh.md
  - How-to guides:
      - Read layers from a GeoPackage: how-to/gis-layers.md
      - Run from a TOML file: how-to/toml-cli.md
      - Water areas: how-to/water-areas.md
      - Refine an existing mesh: how-to/refine.md
      - Use the mesh in D-HYDRO: how-to/d-hydro.md
  - Explanation:
      - Refined quad meshes: explanation/refined-quad-mesh.md
      - FM orthogonality: explanation/orthogonality.md
      - Why refine starts from the mesh: explanation/refine.md
      - Decisions:
          - adr/index.md
          - adr/0001-refine-from-existing-mesh.md
          - adr/0002-output-contract-same-cells.md
  - Reference:
      - API: reference/api.md
